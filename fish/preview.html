<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cá bơi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef7fa;color:#244754;font:16px system-ui}main{max-width:1200px;padding:24px;margin:30px auto}canvas{display:block;width:100%;height:auto;border-radius:24px;background-color:#fff;background-image:linear-gradient(45deg,#f0f7fa 25%,transparent 25%),linear-gradient(-45deg,#f0f7fa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f0f7fa 75%),linear-gradient(-45deg,transparent 75%,#f0f7fa 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}section{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;flex-wrap:wrap}h1{margin:0;font-size:30px}p{line-height:1.6;color:#55747e}button{font:inherit;padding:12px 24px;margin:5px;border:0;border-radius:12px;color:white;background:#16869d;cursor:pointer}button#stop{background:#dcecf1;color:#244754}.status{font-size:14px}@media(max-width:600px){main{margin:0;padding:16px}section{display:block}h1{font-size:26px}}
</style>
<main><canvas id="scene" width="1570" height="1001" aria-label="Cá đang bơi"></canvas>
<section><div><h1>Cá bơi</h1><p>Đuôi quẫy và vây vẫy theo nhịp bơi.</p></div><div><button id="swim">Bơi</button><button id="stop">Dừng</button><p class="status" id="status">Đang tải…</p></div></section></main>
<script type="module">
import Rive from './runtime/canvas_advanced.mjs';
try{
 const rive=await Rive({locateFile:n=>new URL('./runtime/'+(n.includes('fallback')?'rive_fallback.wasm':'rive.wasm'),location.href).href});
 const file=await rive.load(new Uint8Array(await(await fetch('./fish_swim.riv')).arrayBuffer()),undefined,false);
 const canvas=document.getElementById('scene'),renderer=rive.makeRenderer(canvas),status=document.getElementById('status');
 let board,machine,input,events=[],auto=true,last=0;
 function step(dt){machine.advanceAndApply(dt);board.advance(dt);for(let i=0;i<machine.stateChangedCount();i++)events.push(machine.stateChangedNameByIndex(i));}
 function setSwim(value){input.value=Boolean(value);status.textContent=value?'Đang bơi':'Dừng bơi';canvas.setAttribute('aria-label',value?'Cá đang bơi':'Cá dừng bơi');}
 function fresh(swimming=true){if(machine)machine.delete();if(board)board.delete();board=file.artboardByName('Fish');machine=new rive.StateMachineInstance(board.stateMachineByName('FishController'),board);input=machine.input(0).asBool();events=[];setSwim(swimming);step(0);return {is_swimming:input.value};}
 function advance(t){for(let n=Math.round(t*120);n>0;n--)step(1/120);}
 function draw(){canvas.getContext('2d').clearRect(0,0,1570,1001);renderer.beginFrame();renderer.save();renderer.align(rive.Fit.contain,rive.Alignment.center,{minX:0,minY:0,maxX:1570,maxY:1001},board.bounds);board.draw(renderer);renderer.restore();renderer.flush();rive.resolveAnimationFrame();return canvas.toDataURL('image/png');}
 function pose(time){auto=false;if(machine){machine.delete();machine=null;}if(board)board.delete();board=file.artboardByName('Fish');const animation=new rive.LinearAnimationInstance(board.animationByName('swim'),board);animation.time=time;animation.apply(1);board.advance(0);animation.delete();return draw();}
 window.fish={fresh:(swimming=true)=>{auto=false;return fresh(swimming);},setSwim,advance,draw,pose,events:()=>events.slice(),clearEvents:()=>events=[],snapshot:()=>({image:draw(),events:events.slice()})};
 fresh();document.getElementById('swim').onclick=()=>setSwim(true);document.getElementById('stop').onclick=()=>setSwim(false);
 function tick(now){if(auto){step(last?Math.min((now-last)/1000,.05):0);draw();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);window.ready=true;
}catch(e){window.failure=String(e);document.getElementById('status').textContent=String(e);console.error(e);}
</script></html>
